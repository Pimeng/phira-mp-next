[package]
name = "terminal-console"
version = "0.1.0"
edition = "2021"
description = "Interactive terminal console: readline with log printing above the input line (TerminalConsoleAppender equivalent), with Windows ANSI/Win32 auto-adaptation via crossterm."
license = "GPL-3.0-only"

[dependencies]
crossterm = "0.28"
tracing-subscriber = "0.3"
