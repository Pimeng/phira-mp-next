name: Release Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布标签（留空则使用 Cargo.toml 版本号）'
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build:
    name: Build (${{ matrix.platform }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            bin: phira-mp
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            bin: phira-mp
            apt-packages: gcc-aarch64-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            bin: phira-mp.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows-arm64
            bin: phira-mp.exe
          - os: ubuntu-latest
            target: x86_64-unknown-freebsd
            platform: freebsd-x64
            bin: phira-mp
            zigbuild: true
          - os: ubuntu-latest
            target: aarch64-linux-android
            platform: termux-arm64
            bin: phira-mp
            zigbuild: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cross linker (linux-arm64)
        if: matrix.apt-packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt-packages }}

      - name: Setup zig (freebsd / android)
        if: matrix.zigbuild
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        run: pip install --break-system-packages cargo-zigbuild

      - name: Get version from Cargo.toml
        id: version
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.zigbuild }}" = "true" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/
          cp -r lang dist/lang

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phira-mp-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: dist/
