name: Release Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布标签（留空则使用 Cargo.toml 版本号）'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            bin: phira-mp
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            bin: phira-mp
            apt-packages: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            bin: phira-mp.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows-arm64
            bin: phira-mp.exe
          - os: ubuntu-latest
            target: x86_64-unknown-freebsd
            platform: freebsd-x64
            bin: phira-mp
            zigbuild: true
          - os: ubuntu-latest
            target: aarch64-linux-android
            platform: termux-arm64
            bin: phira-mp
            zigbuild: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cross linker (linux-arm64)
        if: matrix.apt-packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt-packages }}

      - name: Setup zig (freebsd / android)
        if: matrix.zigbuild
        uses: goto-bus-stop/setup-zig@v2
        with:
          # zig 0.13 对 Android (bionic) libc 头文件支持不完整，
          # 编译 ring 等含 C 代码的依赖会报 assert.h not found；0.14.0+ 已修复
          version: 0.14.0

      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        run: pip install --break-system-packages -U cargo-zigbuild

      - name: Get version from Cargo.toml
        id: version
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        shell: bash
        run: |
          # 交叉编译目标显式指定链接器，避免 rustc 回退到 host 的 cc/rust-lld
          # （否则链接 aarch64 对象文件时报 incompatible with elf64-x86-64）
          if [ -n "${{ matrix.linker }}" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="${{ matrix.linker }}"
          fi
          if [ "${{ matrix.zigbuild }}" = "true" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/
          cp -r lang dist/lang

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phira-mp-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: dist/
